<div class="shell"><aside class="sidebar"><div class="bar"><h2>Codex &#273;ang ch&#7841;y</h2><button class="iconbtn" id="refresh" title="L&#224;m m&#7899;i">&#8635;</button></div><input class="search" id="search" placeholder="L&#7885;c chat..."><div id="activeCount" class="section-label">&#272;ang t&#7843;i...</div><div id="chatList" class="chat-list"></div></aside><main class="main" id="main"><div class="empty">Ch&#7885;n m&#7897;t chat &#273;ang ch&#7841;y.</div></main></div>
<script nonce="__NONCE__">
const vscode=acquireVsCodeApi(),chatList=document.getElementById('chatList'),activeCount=document.getElementById('activeCount'),main=document.getElementById('main'),search=document.getElementById('search');
let state={activeChats:[],selectedThreadId:'',selected:null,queue:{}},draft='',lastNoticeAt=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const absTime=ms=>{if(!ms)return '--';const d=new Date(ms),now=new Date(),same=d.toDateString()===now.toDateString(),t=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());return same?t:pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+t};
const relTime=ms=>{if(!ms)return '';const s=Math.max(0,Math.floor((Date.now()-ms)/1000));if(s<5)return '\u0076\u1eeba xong';if(s<60)return s+'s';const m=Math.floor(s/60);if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d'};
const short=(s,n=130)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s};
const baseName=p=>String(p||'').replace(/[\\/]+$/,'').split(/[\\/]/).pop()||p||'';
function renderChats(){const q=search.value.trim().toLowerCase();const chats=(state.activeChats||[]).slice().sort((a,b)=>(b.lastActivity||0)-(a.lastActivity||0)).filter(c=>!q||String(c.title||'').toLowerCase().includes(q)||String(c.cwd||'').toLowerCase().includes(q));activeCount.textContent=(state.activeChats||[]).length+' '+('\u0111ang ch\u1ea1y')+' · m\u1edbi nh\u1ea5t tr\u01b0\u1edbc';if(!chats.length){chatList.innerHTML='<div class="empty">Kh\u00f4ng c\u00f3 chat \u0111ang ch\u1ea1y.</div>';return}chatList.innerHTML=chats.map(c=>{const agents=c.runningCount>1?' · '+c.runningCount+' threads':'';return '<div class="chat '+(c.threadId===state.selectedThreadId?'selected':'')+'" data-id="'+esc(c.threadId)+'" title="'+esc(c.cwd||'')+'"><div class="titleline"><span class="dot"></span><span class="chat-title">'+esc(c.title||'Codex chat')+'</span></div><div class="chat-meta"><span class="ellipsis">'+esc(baseName(c.cwd)||'No workspace')+esc(agents)+'</span><span>'+esc(absTime(c.lastActivity))+' · '+esc(relTime(c.lastActivity))+'</span></div></div>'}).join('');for(const el of chatList.querySelectorAll('.chat'))el.onclick=()=>vscode.postMessage({command:'selectChat',threadId:el.dataset.id})}
function queueInfo(){const q=state.queue||{};if(q.busy)return {cls:'',text:'\u0110ang x\u1ebfp tin nh\u1eafn v\u00e0o h\u00e0ng ch\u1edd...'};if(q.notice&&q.notice.text)return {cls:q.notice.kind==='success'?'ok':'err',text:q.notice.text};if(!q.checked)return {cls:'',text:'\u0110ang ki\u1ec3m tra kh\u1ea3 n\u0103ng g\u1eedi...'};if(q.available)return {cls:'',text:'G\u1eedi sau turn hi\u1ec7n t\u1ea1i · gi\u1eef nguy\u00ean chat/model'};return {cls:'err',text:q.reason||'Kh\u00f4ng t\u00ecm th\u1ea5y Codex CLI c\u00f3 h\u1ed7 tr\u1ee3 queue.'}}
function bindComposer(wasFocused,start,end){const ta=document.getElementById('composerInput'),send=document.getElementById('sendBtn'),reprobe=document.getElementById('reprobe');if(!ta||!send)return;ta.value=draft;const update=()=>{draft=ta.value;send.disabled=!String(draft).trim()||!(state.queue&&state.queue.available)||Boolean(state.queue&&state.queue.busy)};ta.oninput=update;ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!send.disabled)send.click()}};send.onclick=()=>{const text=String(draft||'').trim();if(text)vscode.postMessage({command:'queueMessage',text})};if(reprobe)reprobe.onclick=()=>vscode.postMessage({command:'reprobeQueue'});update();if(wasFocused){ta.focus();try{ta.setSelectionRange(Math.min(start,ta.value.length),Math.min(end,ta.value.length))}catch{}}}
function operation(item){return item&&['command','patch','image','tool','mcp','web','agent','hook'].includes(String(item.kind||''))}
function groupTimeline(events){const groups=[];for(const item of events){if(!operation(item)){groups.push({items:[item],operation:false});continue}const prev=groups[groups.length-1];const same=prev&&prev.operation&&prev.items[0].actor===item.actor&&Math.abs((prev.items[prev.items.length-1].at||0)-(item.at||0))<5*60*1000;if(same)prev.items.push(item);else groups.push({items:[item],operation:true})}return groups}
function groupLabel(group){const kinds=new Set(group.items.map(x=>String(x.kind||'')));if(kinds.has('image')&&kinds.size===1)return group.items.length===1?'\u0110\u00e3 xem 1 \u1ea3nh':'\u0110\u00e3 xem '+group.items.length+' \u1ea3nh';if(kinds.has('command')&&kinds.has('patch'))return '\u0110\u00e3 ch\u1ec9nh s\u1eeda c\u00e1c t\u1ec7p, \u0111\u00e3 ch\u1ea1y c\u00e1c l\u1ec7nh';if(kinds.has('patch'))return group.items.length===1?'\u0110\u00e3 ch\u1ec9nh s\u1eeda t\u1ec7p':'\u0110\u00e3 ch\u1ec9nh s\u1eeda c\u00e1c t\u1ec7p';if(kinds.has('command'))return group.items.length===1?(group.items[0].label||'\u0110\u00e3 ch\u1ea1y l\u1ec7nh'):'\u0110\u00e3 ch\u1ea1y c\u00e1c l\u1ec7nh';return group.items.length===1?(group.items[0].label||'Ho\u1ea1t \u0111\u1ed9ng'):'Ho\u1ea1t \u0111\u1ed9ng ('+group.items.length+')'}
function childHtml(item){const at=Number(item.at)||0,children=Array.isArray(item.children)?item.children:[];if(children.length){return children.map(child=>{const childAt=Number(child&&child.at)||at;return '<div class="child"><span class="timeline-icon patch"></span><div><div class="child-label">'+esc(child&&child.label||'Tep da chinh sua')+'</div><div class="child-detail">'+esc(child&&child.detail||'')+'</div></div><span class="event-time">'+esc(childAt?absTime(childAt):'--')+'</span></div>'}).join('')};const detail=String(item.detail||'').trim();return '<div class="child"><span class="timeline-icon '+String(item.kind||'activity')+'"></span><div><div class="child-label">'+esc(item.label||item.type||'Hoat dong')+'</div>'+(detail?'<div class="child-detail">'+esc(detail)+'</div>':'')+'</div><span class="event-time">'+esc(at?absTime(at):'--')+'</span></div>'}
function singleHtml(item,index){const detail=String(item.detail||'').trim(),text=String(item.text||'').trim(),has=Boolean(detail||text),at=Number(item.at)||0,label=item.label||item.type||'Ho\u1ea1t \u0111\u1ed9ng';const body=(detail?'<div class="detail-label">Chi ti\u1ebft</div><pre>'+esc(detail)+'</pre>':'')+(text?'<div class="detail-label">N\u1ed9i dung</div><pre class="message-card '+(item.kind==='user'?'user':'assistant')+'">'+esc(text)+'</pre>':'');const inline=detail?'<div class="timeline-inline">'+esc(short(detail))+'</div>':'';return '<details class="timeline-item '+(has?'has-detail':'')+'"'+(index===0&&item.kind==='message'?' open':'')+'><summary><div class="timeline-row"><span class="timeline-icon '+String(item.kind||'activity')+'"></span><span class="timeline-main"><span class="timeline-label"><b>'+esc(label)+'</b><span class="timeline-actor">'+esc(item.actor||'Main')+'</span>'+(item.type?'<span class="event-type">'+esc(item.type)+'</span>':'')+'</span>'+inline+'</span><span class="event-time" title="'+esc(at?absTime(at):'--')+'">'+esc(at?(absTime(at)+' · '+relTime(at)):'--')+'</span></div></summary>'+(has?'<div class="timeline-detail">'+body+'</div>':'')+'</details>'}
function renderTimeline(d){const events=(Array.isArray(d.timeline)?d.timeline:[]).filter(Boolean),groups=groupTimeline(events);if(!groups.length)return '<div class="sub">Ch\u01b0a c\u00f3 s\u1ef1 ki\u1ec7n chi ti\u1ebft.</div>';const html=groups.map((group,index)=>{if(!group.operation)return singleHtml(group.items[0],index);const first=group.items[0],at=Number(first.at)||0,has=group.items.some(x=>String(x.detail||'').trim()),children=group.items.map(childHtml).join('');return '<details class="timeline-item has-detail"'+(index===0?' open':'')+'><summary><div class="timeline-row"><span class="timeline-icon '+String(first.kind||'activity')+'"></span><span class="timeline-main"><span class="timeline-label"><b>'+esc(groupLabel(group))+'</b><span class="timeline-actor">'+esc(first.actor||'Main')+'</span><span class="summary-meta"> · '+group.items.length+' m\u1ee5c</span></span><div class="timeline-inline">'+esc(short(group.items.map(x=>x.detail||x.label||'').join(' · '),150))+'</div></span><span class="event-time" title="'+esc(at?absTime(at):'--')+'">'+esc(at?(absTime(at)+' · '+relTime(at)):'--')+'</span></div></summary><div class="timeline-detail"><div class="child-list">'+children+'</div></div></details>'}).join('');return '<div class="timeline">'+html+'</div>'+(d.truncated?'<div class="truncated-note">Nh\u1eadt k\u00fd b\u1ecb gi\u1edbi h\u1ea1n theo dung l\u01b0\u1ee3ng c\u1ea5u h\u00ecnh; c\u00e1c m\u1ee5c c\u0169 h\u01a1n c\u00f3 th\u1ec3 kh\u00f4ng hi\u1ec7n.</div>':'')}
function renderMain(){const old=document.getElementById('composerInput'),wasFocused=old&&document.activeElement===old,start=old&&old.selectionStart||0,end=old&&old.selectionEnd||0,d=state.selected;if(!d){main.innerHTML='<div class="empty">Ch\u1ecdn m\u1ed9t chat \u0111ang ch\u1ea1y.</div>';return}const running=d.stateKind==='running';let html='<div class="head"><div class="head-left"><div class="title">'+esc(d.title||'Codex chat')+'</div><div class="sub" title="'+esc(d.cwd||'')+'">'+esc(baseName(d.cwd)||d.cwd||'')+' · ho\u1ea1t \u0111\u1ed9ng '+esc(absTime(d.lastActivityMs))+' · '+esc(relTime(d.lastActivityMs))+'</div></div><div class="state '+(running?'running':'stopped')+'">'+esc(d.state||'Unknown')+'</div></div>';if(!running)html+='<div class="stopped-card">Chat \u0111\u00e3 c\u00f3 tr\u1ea1ng th\u00e1i terminal. L\u1ecbch s\u1eed ho\u1ea1t \u0111\u1ed9ng v\u00e0 chi ti\u1ebft v\u1eabn \u0111\u01b0\u1ee3c gi\u1eef l\u1ea1i.</div>';if(d.current){const at=Number(d.current.at)||Number(d.lastActivityMs)||0;html+='<section class="card"><div class="card-title">Ho\u1ea1t \u0111\u1ed9ng hi\u1ec7n t\u1ea1i</div><div class="current-card"><div><div class="current-label">'+esc(d.current.label||'\u0110ang x\u1eed l\u00fd')+' <span class="timeline-actor">'+esc(d.current.actor||'Main')+'</span></div>'+(d.current.detail?'<div class="current-detail" title="'+esc(d.current.detail)+'">'+esc(d.current.detail)+'</div>':'')+'</div><div class="event-time" title="'+esc(at?absTime(at):'--')+'">'+esc(at?(absTime(at)+' · '+relTime(at)):'--')+'</div></div></section>'}const workers=(d.activeNodes||[]).slice().sort((a,b)=>(b.currentAt||b.updatedAt||0)-(a.currentAt||a.updatedAt||0));if(running){html+='<section class="card"><div class="card-title">'+('\u0110ang ch\u1ea1y')+' · '+workers.length+' thread</div><div class="workers">';if(!workers.length)html+='<div class="sub">\u0110ang c\u1eadp nh\u1eadt tr\u1ea1ng th\u00e1i thread...</div>';else html+=workers.map(n=>{const detail=String(n.currentDetail||'').trim(),text=String(n.currentText||'').trim(),task=String(n.taskPreview||'').trim(),has=Boolean(detail||text||task),at=Number(n.currentAt)||Number(n.updatedAt)||0;return '<details class="worker '+(has?'has-detail':'')+'"><summary><div class="worker-row"><span class="dot"></span><div class="worker-action"><b>'+esc(n.actor||'Sub-agent')+'</b> · '+esc(n.current||'\u0110ang x\u1eed l\u00fd')+(detail?' <span class="muted">· '+esc(short(detail,100))+'</span>':'')+'</div><span class="worker-time" title="'+esc(at?absTime(at):'--')+'">'+esc(at?(absTime(at)+' · '+relTime(at)):'--')+'</span></div></summary>'+(has?'<div class="worker-detail">'+(detail?'<div>Chi ti\u1ebft hi\u1ec7n t\u1ea1i</div><pre>'+esc(detail)+'</pre>':'')+(text?'<div>N\u1ed9i dung hi\u1ec7n t\u1ea1i</div><pre>'+esc(text)+'</pre>':'')+(!text&&!detail&&task?'<div>Nhi\u1ec7m v\u1ee5</div><pre>'+esc(task)+'</pre>':'')+'</div>':'')+'</details>'}).join('');html+='</div></section>'}html+='<section class="card"><div class="card-title">L\u1ecbch s\u1eed ho\u1ea1t \u0111\u1ed9ng <span class="summary-meta">· '+((d.timeline||[]).length)+' m\u1ee5c</span></div>'+renderTimeline(d)+'</section>';if(d.latestUserText)html+='<section class="card"><div class="card-title">Y\u00eau c\u1ea7u g\u1ea7n nh\u1ea5t</div><div class="message-card user">'+esc(d.latestUserText)+'</div></section>';if(d.latestAssistantText)html+='<section class="card"><div class="card-title">Ph\u1ea3n h\u1ed3i g\u1ea7n nh\u1ea5t</div><div class="message-card assistant">'+esc(d.latestAssistantText)+'</div></section>';if(!running){main.innerHTML=html;return}const qi=queueInfo(),q=state.queue||{};html+='<section class="card"><div class="card-title">Nh\u1eafn v\u00e0o chat n\u00e0y</div><div class="composer"><textarea id="composerInput" placeholder="Tin nh\u1eafn s\u1ebd \u0111\u01b0\u1ee3c x\u1ebfp sau turn \u0111ang ch\u1ea1y. Ctrl+Enter \u0111\u1ec3 g\u1eedi."></textarea><button class="send" id="sendBtn">G\u1eedi sau</button></div><div class="queue
