function proxyRestartTitle(localProxy = {}) {

      : 'Chưa ghi nhận';
  };
  const lines = [
    localProxy.busy ? 'Đang khởi động lại proxy…' : 'Khởi động lại proxy',
    'Reset thành công gần nhất: ' + timestamp(last?.at || localProxy.lastRestartAt)
  ];
  if (last) {
    lines.push('Nguồn: ' + (last.source === 'auto' ? 'Tự động' : 'Bấm tay') +
      (last.processId ? ' · PID ' + last.processId : '') +
      ' · Đã dừng ' + (last.stoppedCount || 0) + ' tiến trình');
  }
  lines.push('Lần thử gần nhất: ' + timestamp(watchdog.lastAttemptAt));
  lines.push('Tự restart: ' + (watchdog.enabled ? 'Bật' : 'Tắt') + ' · Ngưỡng ' + (watchdog.minutes || 5) + ' phút');
  if (assessment.checkedAt) {
    lines.push('Task đang chạy: ' + (assessment.taskCount || 0));
    if (assessment.latestActivityAt) {
      const seconds = Math.max(0, Math.floor((Date.now() - assessment.latestActivityAt) / 1000));
      lines.push('Task mới nhất hoạt động: ' + timestamp(assessment.latestActivityAt) + ' (' + seconds + ' giây trước)');
    }
    lines.push('Đánh giá gần nhất: ' + timestamp(assessment.checkedAt));
  }
  lines.push('Trạng thái: ' + (watchdog.notice || (watchdog.enabled ? 'Chờ đánh giá task.' : 'Tự restart đang tắt.')));
  if (localProxy.recovery?.pendingCount) lines.push('Khôi phục: đang theo dõi ' + localProxy.recovery.pendingCount + ' chat.');
  if (localProxy.recovery?.notice) lines.push(localProxy.recovery.notice);
  if (localProxy.notice?.text) lines.push(localProxy.notice.text);
  lines.push(localProxy.executablePath ? 'EXE: ' + localProxy.executablePath : 'Chưa chọn file proxy .exe.');
  lines.push('Chuột phải để cài đặt');

}

const USAGE_CHART_RANGES=[{value:60,label:'1 giờ'},{value:180,label:'3 giờ'},{value:360,label:'6 giờ'},{value:720,label:'12 giờ'},{value:1440,label:'24 giờ'},{value:0,label:'Tất cả dữ liệu lưu (24 giờ)'}];
const USAGE_CHART_POINT_OPTIONS=[{value:30,label:'Tối đa 30 mốc'},{value:60,label:'Tối đa 60 mốc'},{value:99,label:'Tối đa 99 mốc'},{value:150,label:'Tối đa 150 mốc'},{value:300,label:'Tối đa 300 mốc'},{value:720,label:'Tất cả mốc'}];
usageChartSettings=normalizeUsageChartSettings(savedUi.usageChartSettings);
function normalizeUsageChartSettings(value){
  const source=value&&typeof value==='object'?value:{};
  const ranges=USAGE_CHART_RANGES.map(item=>item.value),points=USAGE_CHART_POINT_OPTIONS.map(item=>item.value);
  const rangeMinutes=Number(source.rangeMinutes),maxPoints=Number(source.maxPoints);
  return {rangeMinutes:ranges.includes(rangeMinutes)?rangeMinutes:1440,maxPoints:points.includes(maxPoints)?maxPoints:150};
}
function usageChartLabel(items,value){return (items.find(item=>item.value===value)||items[0]).label}
function usageChartView(chart,settings){
  const all=Array.isArray(chart&&chart.points)?chart.points.filter(point=>Number.isFinite(Number(point.at))&&Number.isFinite(Number(point.usedPercent))).sort((a,b)=>a.at-b.at):[];
  if(!all.length)return {points:[],sourceCount:0,rangeStart:0,rangeEnd:0};
  const end=Number(chart.rangeEnd)||all.at(-1).at;
  const rangeMs=settings.rangeMinutes>0?settings.rangeMinutes*60000:Math.max(0,(Number(chart.rangeEnd)||end)-(Number(chart.rangeStart)||all[0].at));
  const rangeStart=settings.rangeMinutes>0?end-rangeMs:(Number(chart.rangeStart)||all[0].at);
  const filtered=all.filter(point=>point.at>=rangeStart&&point.at<=end);
  const limit=settings.maxPoints;
  if(!limit||filtered.length<=limit)return {points:filtered,sourceCount:filtered.length,rangeStart,rangeEnd:end};
  const picked=[];
  const step=(filtered.length-1)/(limit-1);
  for(let index=0;index<limit;index++)picked.push(filtered[Math.round(index*step)]);
  return {points:picked,sourceCount:filtered.length,rangeStart,rangeEnd:end};
}
function usageChartPlot(chart,settings){
  const view=usageChartView(chart,settings),points=view.points;
  if(!points.length)return '<div class="usage-chart-empty">Chưa có đủ mốc quota trong khoảng đã chọn. Hãy chọn khoảng rộng hơn hoặc chờ thêm dữ liệu.</div>';
  const width=540,height=250,left=42,right=14,top=18,bottom=42;
  const start=Number(view.rangeStart)||points[0].at,end=Math.max(start+1,Number(view.rangeEnd)||points.at(-1).at);
  const x=at=>left+((Number(at)-start)/(end-start))*(width-left-right);
  const y=percent=>top+(100-Math.max(0,Math.min(100,Number(percent)||0)))/100*(height-top-bottom);
  const grid=[0,50,100].map(percent=>'<line class="usage-chart-axis" x1="'+left+'" y1="'+y(percent)+'" x2="'+(width-right)+'" y2="'+y(percent)+'"></line><text class="usage-chart-label" x="4" y="'+(y(percent)+4)+'">'+percent+'%</text>').join('');
  const polyline=points.map(point=>x(point.at).toFixed(2)+','+y(point.usedPercent).toFixed(2)).join(' ');
  const markers=points.map(point=>'<circle class="usage-chart-point" cx="'+x(point.at).toFixed(2)+'" cy="'+y(point.usedPercent).toFixed(2)+'" r="3"><title>'+esc(absTime(point.at))+' · đã dùng '+Math.round(point.usedPercent)+'%</title></circle>').join('');
  const first=points[0],last=points.at(-1);
  const labels='<text class="usage-chart-label" x="'+left+'" y="'+(height-12)+'">'+esc(absTime(first.at))+'</text><text class="usage-chart-label" text-anchor="end" x="'+(width-right)+'" y="'+(height-12)+'">'+esc(absTime(last.at))+'</text>';
  return '<svg class="usage-chart-plot" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Đồ thị phần trăm quota đã dùng theo thời điểm">'+grid+'<polyline class="usage-chart-line" points="'+polyline+'"></polyline>'+markers+labels+'</svg>';
}
function usageChartSummary(chart,settings){
  const view=usageChartView(chart,settings),duration=view.points.length>1?Math.round((view.points.at(-1).at-view.points[0].at)/60000):0;
  return view.points.length?'Quota 5h · '+view.sourceCount+' mốc dữ liệu, đang hiển thị '+view.points.length+' mốc trong khoảng '+(duration?duration+' phút':'chưa đủ 2 mốc')+'. Điểm đo là phần trăm đã dùng.':'Chưa có dữ liệu trong khoảng đã chọn.';
}
function usageChartControls(settings){

function moveUsageChartDialog(){
  const dialogs=Array.from(document.querySelectorAll('#usageChartDialog'));
  if(!dialogs.length)return null;
  const dialog=dialogs.find(item=>item.open)||dialogs.find(item=>item.parentElement===main)||dialogs[0];
  if(dialog.parentElement!==document.body)document.body.appendChild(dialog);
  for(const duplicate of dialogs)if(duplicate!==dialog)duplicate.remove();
  return dialog;
}

    '<section class="usage-alert-section"><div class="usage-alert-section-title">Chu kỳ kiểm tra Usage</div>'+

    '<label class="usage-alert-check"><input id="usageAlertsEnabled" type="checkbox" '+(enabled?'checked':'')+'> Bật cảnh báo quota</label>'+
    '<section class="usage-alert-section quota-section"><div class="usage-alert-section-title">Quota 5h</div>'+
    '<label class="usage-alert-check"><input id="usageAlertPrimaryEnabled" type="checkbox" '+(primaryEnabled?'checked':'')+'> Theo dõi quota 5h</label>'+
    '<div class="usage-alert-field"><label for="usageAlertPrimaryThresholds">Mốc % đã dùng</label><input id="usageAlertPrimaryThresholds" type="text" value="'+esc(usageAlertListValue(primary.thresholds,'usedPercent'))+'" placeholder="50,70,85,95"><span class="usage-alert-help">Ví dụ: 50,70,85,95</span></div>'+
    '<div class="usage-alert-field"><label for="usageAlertPrimaryRates">Tốc độ trung bình (%/giờ)</label><input id="usageAlertPrimaryRates" type="text" value="'+esc(usageAlertListValue(primary.rateThresholds,'percentPerHour'))+'" placeholder="10,20,30"><span class="usage-alert-help">Ví dụ: 10,20,30</span></div></section>'+
    '<section class="usage-alert-section quota-section"><div class="usage-alert-section-title">Quota 7d</div>'+
    '<label class="usage-alert-check"><input id="usageAlertSecondaryEnabled" type="checkbox" '+(secondaryEnabled?'checked':'')+'> Theo dõi quota 7d</label>'+
    '<div class="usage-alert-field"><label for="usageAlertSecondaryThresholds">Mốc % đã dùng</label><input id="usageAlertSecondaryThresholds" type="text" value="'+esc(usageAlertListValue(secondary.thresholds,'usedPercent'))+'" placeholder="70,90"><span class="usage-alert-help">Ví dụ: 70,90</span></div>'+
    '<div class="usage-alert-field"><label for="usageAlertSecondaryRates">Tốc độ trung bình (%/giờ)</label><input id="usageAlertSecondaryRates" type="text" value="'+esc(usageAlertListValue(secondary.rateThresholds,'percentPerHour'))+'" placeholder="5,10"><span class="usage-alert-help">Ví dụ: 5,10; có thể để trống</span></div></section>'+
    '<section class="usage-alert-section"><div class="usage-alert-section-title">Đọc quota bằng tiếng Việt</div>'+
    '<label class="usage-alert-check"><input id="usageVoiceEnabled" type="checkbox" '+(voiceEnabled?'checked':'')+'> Bật đọc phần trăm bằng tiếng Việt</label>'+
    '<label class="usage-alert-check"><input id="usageVoiceOnChange" type="checkbox" '+(voiceOnChange?'checked':'')+'> Đọc khi phần trăm thay đổi</label>'+
    '<label class="usage-alert-check"><input id="usageVoiceOnLargeChange" type="checkbox" '+(voiceOnLargeChange?'checked':'')+'> Đọc khi thay đổi lớn</label>'+
    '<div class="usage-alert-field"><label for="usageVoiceLargeChange">Thay đổi từ bao nhiêu điểm % là lớn</label><input id="usageVoiceLargeChange" type="number" min="1" max="100" step="1" value="'+esc(voiceLargeChange)+'"><span class="usage-alert-help">Số nguyên từ 1 đến 100. Giá trị đọc luôn là số nguyên từ 0 đến 100.</span></div></section>'+
    '<section class="usage-alert-section"><div class="usage-alert-section-title">Tự compact context</div>'+
    '<label class="usage-alert-check"><input id="contextCompactEnabled" type="checkbox" '+(contextEnabled?'checked':'')+'> Tự dừng, compact và tiếp tục khi context vượt ngưỡng</label>'+
    '<label class="usage-alert-check"><input id="contextCompactResume" type="checkbox" '+(contextResume?'checked':'')+'> Tự resume task sau khi compact</label>'+

    '<div id="usageAlertDialogError" class="usage-alert-error" role="alert"></div>'+

}

function moveUsageAlertDialog(){
  const dialogs=Array.from(document.querySelectorAll('#usageAlertDialog'));
  if(!dialogs.length)return null;
  const dialog=dialogs.find(item=>item.open)||dialogs.find(item=>item.parentElement===main)||dialogs[0];
  if(dialog.parentElement!==document.body)document.body.appendChild(dialog);
  for(const duplicate of dialogs)if(duplicate!==dialog)duplicate.remove();
  return dialog;
}

function syncUsageAlertDialog(dialog){
  if(!dialog||dialog.open)return;
  const settings=state.usage&&state.usage.alerts&&state.usage.alerts.settings||{};
  const voice=state.usage&&state.usage.voice||{};
  const context=state.usage&&state.usage.context||{};
  const contextSettings=context.settings||{};
  const primary=settings.primary||{},secondary=settings.secondary||{};
  const setValue=(id,value)=>{const field=document.getElementById(id);if(field)field.value=String(value??'')};
  const setChecked=(id,value)=>{const field=document.getElementById(id);if(field)field.checked=Boolean(value)};
  setValue('usageAlertInterval',state.usage&&state.usage.intervalMinutes!==undefined?state.usage.intervalMinutes:5);
  setChecked('usageAlertsEnabled',settings.enabled!==false);
  setChecked('usageAlertPrimaryEnabled',primary.enabled!==false);
  setValue('usageAlertPrimaryThresholds',usageAlertListValue(primary.thresholds,'usedPercent'));
  setValue('usageAlertPrimaryRates',usageAlertListValue(primary.rateThresholds,'percentPerHour'));
  setChecked('usageAlertSecondaryEnabled',secondary.enabled===true);
  setValue('usageAlertSecondaryThresholds',usageAlertListValue(secondary.thresholds,'usedPercent'));
  setValue('usageAlertSecondaryRates',usageAlertListValue(secondary.rateThresholds,'percentPerHour'));
  setChecked('usageVoiceEnabled',voice.enabled===true);
  setChecked('usageVoiceOnChange',voice.speakOnChange!==false);
  setChecked('usageVoiceOnLargeChange',voice.speakOnLargeChange!==false);
  setValue('usageVoiceLargeChange',voice.largeChangePercent||10);
  setChecked('contextCompactEnabled',contextSettings.enabled===true);
  setChecked('contextCompactResume',contextSettings.resumeAfterCompact!==false);
  setValue('contextCompactThreshold',contextSettings.thresholdPercent||80);
  const error=document.getElementById('usageAlertDialogError');
  if(error)error.textContent='';
}

function parseUsageAlertDialogList(id,kind,allowEmpty){
  const value=String(document.getElementById(id)?.value||'').trim();
  if(!value)return allowEmpty?[]:null;
  const values=value.split(',').map(item=>Number(item.trim()));
  const valid=values.length>0&&values.every(item=>Number.isFinite(item)&&(kind==='percent'?(item>0&&item<100):(item>0&&item<=1000)));
  return valid?values:null;
}

function parseUsageAlertDialogInterval(){
  const value=String(document.getElementById('usageAlertInterval')?.value||'').trim();
  if(!/^\d+$/.test(value))return null;
  const minutes=Number(value);
  return Number.isInteger(minutes)&&minutes>=0&&minutes<=1440?minutes:null;
}

function parseUsageVoiceLargeChange(){
  const value=String(document.getElementById('usageVoiceLargeChange')?.value||'').trim();
  if(!/^\d+$/.test(value))return null;
  const percent=Number(value);
  return Number.isInteger(percent)&&percent>=1&&percent<=100?percent:null;
}

function parseContextCompactThreshold(){
  const value=String(document.getElementById('contextCompactThreshold')?.value||'').trim();
  if(!/^\d+$/.test(value))return null;
  const percent=Number(value);
  return Number.isInteger(percent)&&percent>=1&&percent<=99?percent:null;
}

function saveUsageAlertDialog(dialog){
  const error=document.getElementById('usageAlertDialogError');
  const interval=parseUsageAlertDialogInterval();
  const primaryThresholds=parseUsageAlertDialogList('usageAlertPrimaryThresholds','percent',false);
  const primaryRates=parseUsageAlertDialogList('usageAlertPrimaryRates','rate',true);
  const secondaryThresholds=parseUsageAlertDialogList('usageAlertSecondaryThresholds','percent',true);
  const secondaryRates=parseUsageAlertDialogList('usageAlertSecondaryRates','rate',true);
  const voiceLargeChange=parseUsageVoiceLargeChange();
  const contextThreshold=parseContextCompactThreshold();
  if(interval===null||!primaryThresholds||!primaryRates||!secondaryThresholds||!secondaryRates||voiceLargeChange===null||contextThreshold===null){
    if(error)error.textContent=interval===null?'Chu kỳ phải là số nguyên từ 0 đến 1440 phút.':voiceLargeChange===null?'Mức thay đổi lớn phải là số nguyên từ 1 đến 100.':contextThreshold===null?'Ngưỡng context phải là số nguyên từ 1 đến 99.':'Kiểm tra lại cú pháp: dùng các số cách nhau bằng dấu phẩy, ví dụ 50,70,85,95 hoặc 10,20,30.';
    return;
  }
  const toText=values=>values.join(',');
  vscode.postMessage({command:'saveUsageAlertSettings',settings:{
    intervalMinutes:interval,
    enabled:Boolean(document.getElementById('usageAlertsEnabled')?.checked),
    primary:{
      enabled:Boolean(document.getElementById('usageAlertPrimaryEnabled')?.checked),
      thresholds:toText(primaryThresholds),
      rateThresholds:toText(primaryRates)
    },
    secondary:{
      enabled:Boolean(document.getElementById('usageAlertSecondaryEnabled')?.checked),
      thresholds:toText(secondaryThresholds),
      rateThresholds:toText(secondaryRates)
    },
    voice:{
      enabled:Boolean(document.getElementById('usageVoiceEnabled')?.checked),
      speakOnChange:Boolean(document.getElementById('usageVoiceOnChange')?.checked),
      speakOnLargeChange:Boolean(document.getElementById('usageVoiceOnLargeChange')?.checked),
      largeChangePercent:voiceLargeChange
    },
    context:{
      enabled:Boolean(document.getElementById('contextCompactEnabled')?.checked),
      resumeAfterCompact:Boolean(document.getElementById('contextCompactResume')?.checked),
      thresholdPercent:contextThreshold
    }
  }});
  dialog?.close();
}

function renderAuthSession(){
  const auth = state.authSession || {};
  const account = esc(auth.accountLabel || 'Đang tải...');
  const disabled = auth.busy || auth.canDeactivate === false;
  return '<section class="card auth-session-card">' +
    '<div class="auth-session-row"><span class="auth-session-account" title="' + account + '">' + account + '</span>' +
    '<button class="send" id="deactivateSession" type="button" ' + (disabled ? 'disabled' : '') + '>Deactive</button></div>'+renderUsage()+renderUsageAlertDialog()+'</section>';
}

function bindAuthSessionUi(){
  const button=document.getElementById('deactivateSession');
  if(button)button.onclick=()=>{
    if(button.disabled||state.authSession?.busy)return;
    button.disabled=true;
    vscode.postMessage({command:'deactivateSession'});
  };
}

function renderComposer(){
  const running=state.selected&&state.selected.stateKind==='running',si=running&&steerInfo(),qi=running&&queueInfo();
  const n=state.continuation&&state.continuation.notice,ci=n&&n.threadId===state.selectedThreadId?n:null;
  const ii=state.interrupt||{};const statuses=[si&&'<div class="action-status '+esc(si.cls)+'" role="status"><b>Steer ngay:</b> '+esc(si.text)+'</div>',qi&&'<div class="action-status '+esc(qi.cls)+'" role="status"><b>G&#7917;i sau:</b> '+esc(qi.text)+'</div>',ii.notice&&'<div class="action-status '+(ii.notice.kind==='success'?'ok':'err')+'" role="status"><b>D&#7915;ng:</b> '+esc(ii.notice.text)+'</div>',ci&&'<div class="action-status '+(ci.kind==='success'?'ok':'err')+'" role="status">'+esc(ci.text)+'</div>',composerNotice&&'<div class="action-status err" role="alert">'+esc(composerNotice)+'</div>'].filter(Boolean).join('');
  const buttons=running?'<button class="send steer" id="steerBtn" title="G&#7917;i v&#224;o l&#432;&#7907;t &#273;ang ch&#7841;y">Steer ngay</button><button class="send queue" id="queueBtn" title="X&#7871;p tin nh&#7855;n g&#7917;i sau l&#432;&#7907;t hi&#7879;n t&#7841;i">G&#7917;i sau</button><button class="send stop" id="stopBtn" title="D&#7915;ng l&#432;&#7907;t &#273;ang ch&#7841;y">D&#7915;ng</button><button class="send pause-goal" id="pauseGoalBtn" title="Pause goal · t&#7841;m d&#7915;ng goal b&#7857;ng c&#225;ch d&#7915;ng l&#432;&#7907;t hi&#7879;n t&#7841;i" aria-label="Pause goal">⏸ Pause goal</button>':'<button class="send continue" id="continueBtn" title="B&#7855;t &#273;&#7847;u l&#432;&#7907;t m&#7899;i trong cu&#7897;c tr&#242; chuy&#7879;n n&#224;y">Ti\u1ebfp t\u1ee5c chat</button>';
  return '<section class="card composer-card"><div class="card-title">'+(running?'Nhắn vào chat này':'Tiếp tục cuộc trò chuyện')+'</div><div class="composer"><textarea id="composerInput" placeholder="'+(running?'Nhập tin nhắn hoặc dán ảnh...':'Nhập yêu cầu tiếp theo hoặc dán ảnh...')+'" aria-label="Tin nhắn cho chat này"></textarea><div class="composer-actions">'+buttons+'</div></div><div class="composer-image-tools"><button class="iconbtn" type="button" id="addImageBtn" title="Thêm ảnh" aria-label="Thêm ảnh">▧ Ảnh</button><input id="imagePicker" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>'+imageMarkup(draftImages,true)+'</div><div class="composer-meta">'+statuses+'<button class="iconbtn" type="button" id="reprobe" title="Kiểm tra lại khả năng gửi" aria-label="Kiểm tra lại khả năng gửi">↻</button></div></section>';
}
function renderMain(){
  const ui=captureUiState(),old=document.getElementById('composerInput'),wasFocused=old&&document.activeElement===old,start=old&&old.selectionStart||0,end=old&&old.selectionEnd||0,d=state.selected;
  imageSources=[];
  if(!d){
    main.innerHTML=renderAuthSession()+renderGateway()+'<div class="empty">Chọn một chat để xem hoạt động; Gateway vẫn cấu hình được ở trên.</div>';
    bindAuthSessionUi();
    bindUsageUi();
    bindGatewayUi();
    restoreUiState(ui);
    return;
  }
  const running=d.stateKind==='running',at=Number(d.lastActivityMs)||0;
  const conversationCount=Array.isArray(d.conversation)?d.conversation.length:(Array.isArray(d.timeline)?d.timeline.filter(item=>item&&['user','message'].includes(String(item.kind||''))).length:0);
  let html='<div class="head"><div class="head-left"><div class="title">'+esc(d.title||'Codex chat')+'</div><div class="sub" title="'+esc(d.cwd||'')+'">'+esc(baseName(d.cwd)||d.cwd||'')+' · hoạt động '+timeHtml(at,'head-time')+'</div>'+runtimeMeta(d.runtime)+'</div><div class="state '+(running?'running':'stopped')+'">'+esc(d.state||'Unknown')+'</div></div>';
  html+='<div class="view-switch" role="tablist" aria-label="Cách xem lịch sử"><button type="button" id="summaryView" role="tab" aria-selected="'+String(viewMode==='summary')+'">Tổng quan</button><button type="button" id="chronologicalView" role="tab" aria-selected="'+String(viewMode==='chronological')+'">Theo thứ tự</button></div>';
  if(viewMode==='chronological')html+='<div class="transcript-filters" role="group" aria-label="Bộ lọc Theo thứ tự"><span>Hiển thị:</span><button type="button" id="conversationFilter" data-active="'+String(chronologicalFilter==='conversation')+'">\u0110\u1ed1i \u0111\u00e1p ('+Math.min(10,conversationCount)+')</button><button type="button" id="activityFilter" data-active="'+String(chronologicalFilter==='all')+'">Tất cả hoạt động</button></div>';
  html+=renderAuthSession()+renderGateway();
  if(viewMode==='chronological')html+=renderTranscript(d);
  else html+=renderCurrent(d)+renderWorkers(d)+renderHistory(d)+renderLatest(d);
  html+=renderComposer();
  main.innerHTML=html;
  bindAuthSessionUi();
  bindUsageUi();
  const setMode=mode=>{viewMode=mode;vscode.setState({...vscode.getState(),viewMode});renderMain()};
  document.getElementById('summaryView').onclick=()=>setMode('summary');
  document.getElementById('chronologicalView').onclick=()=>setMode('chronological');
  const conversationFilter=document.getElementById('conversationFilter'),activityFilter=document.getElementById('activityFilter');
  if(conversationFilter)conversationFilter.onclick=()=>{chronologicalFilter='conversation';vscode.setState({...vscode.getState(),chronologicalFilter});renderMain()};
  if(activityFilter)activityFilter.onclick=()=>{chronologicalFilter='all';vscode.setState({...vscode.getState(),chronologicalFilter});renderMain()};
  bindGatewayUi();
  bindComposer(wasFocused,start,end);
  bindLatestCopy();
  bindImageViewer();
  restoreUiState(ui);
}
function render(){renderChats();renderMain()}search.addEventListener('input',renderChats);document.getElementById('refresh').onclick=()=>vscode.postMessage({command:'refresh'});const resizer=document.getElementById('sidebarResizer');
if(resizer){
  let dragging=false,dragVertical=false,startPosition=0,startSize=0;
  const stacked=()=>window.matchMedia('(max-width:700px)').matches;
  const updateResizer=()=>{const vertical=stacked();resizer.setAttribute('aria-orientation',vertical?'horizontal':'vertical');resizer.setAttribute('aria-valuemin',String(vertical?minSidebarHeight:minSidebarWidth));resizer.setAttribute('aria-valuemax',String(vertical?maxSidebarHeight():maxSidebarWidth()));resizer.setAttribute('aria-valuenow',String(vertical?sidebarHeight:sidebarWidth));resizer.setAttribute('aria-label',vertical?'Resize chat list height':'Resize chat list width');resizer.title=resizer.getAttribute('aria-label')};
  const setSize=(size,vertical=stacked())=>{if(vertical){sidebarHeight=clampSidebarHeight(size);document.documentElement.style.setProperty('--sidebar-height',sidebarHeight+'px')}else{sidebarWidth=clampSidebarWidth(size);document.documentElement.style.setProperty('--sidebar-width',sidebarWidth+'px')}updateResizer();vscode.setState({...vscode.getState(),sidebarWidth,sidebarHeight})};
  resizer.addEventListener('pointerdown',e=>{dragging=true;dragVertical=stacked();startPosition=dragVertical?e.clientY:e.clientX;startSize=dragVertical?sidebarHeight:sidebarWidth;resizer.classList.add('dragging');resizer.setPointerCapture?.(e.pointerId);e.preventDefault()});
  resizer.addEventListener('pointermove',e=>{if(dragging)setSize(startSize+(dragVertical?e.clientY:e.clientX)-startPosition,dragVertical)});
  resizer.addEventListener('keydown',e=>{const vertical=stacked(),back=vertical?'ArrowUp':'ArrowLeft',forward=vertical?'ArrowDown':'ArrowRight';if([back,forward,'Home','End'].includes(e.key)){e.preventDefault();const current=vertical?sidebarHeight:sidebarWidth;setSize(e.key==='Home'?(vertical?minSidebarHeight:minSidebarWidth):e.key==='End'?(vertical?maxSidebarHeight():maxSidebarWidth()):current+(e.key===forward?20:-20),vertical)}});
  const stop=()=>{dragging=false;resizer.classList.remove('dragging')};resizer.addEventListener('pointerup',stop);resizer.addEventListener('pointercancel',stop);
  updateResizer();window.addEventListener('resize',()=>setSize(stacked()?sidebarHeight:sidebarWidth));
}
function switchDraftThread(threadId){
  const id=String(threadId||'');
  if(id===currentDraftThreadId)return;
  if(currentDraftThreadId)drafts[currentDraftThreadId]={text:draft,images:draftImages};
  const saved=drafts[id]||{};
  draft=String(saved.text||'');
  draftImages=Array.isArray(saved.images)?saved.images:[];
  currentDraftThreadId=id;
  composerNotice='';
}
function setChatTab(nonRunning){
  state.showNonRunning=nonRunning;
  renderChats();
  vscode.postMessage({command:'setShowNonRunning',enabled:nonRunning});
}
document.getElementById('runningTab').onclick=()=>setChatTab(false);
document.getElementById('nonRunningTab').onclick=()=>setChatTab(true);
const pendingContinuation={};
let copyNotice={field:'',kind:'',text:''};
let deferredRender=false;
function interactionBlocksRender(){
  const active=document.activeElement;
  if(main.contains(active)&&active.matches('textarea,input,select,[contenteditable="true"]'))return true;
  const selection=window.getSelection&&window.getSelection();
  return Boolean(selection&&!selection.isCollapsed&&main.contains(selection.anchorNode));
}
function requestRender(){
  if(interactionBlocksRender()){deferredRender=true;renderChats();return;}
  deferredRender=false;
  render();
}
function flushDeferredRender(){
  if(deferredRender&&!interactionBlocksRender()){deferredRender=false;render();}
}
document.addEventListener('selectionchange',()=>setTimeout(flushDeferredRender,0));
document.addEventListener('focusout',()=>setTimeout(flushDeferredRender,0));
window.addEventListener('message',e=>{
  const m=e.data;
  if(m.type==='state'){
    const previousThreadId=state.selectedThreadId;
    state=m.data||state;
    const selectionChanged=previousThreadId!==state.selectedThreadId;
    const gwNotice=state.gateway&&state.gateway.actionNotice;
    if(gwNotice&&gwNotice.at&&gwNotice.at!==lastGatewayNoticeAt){
      lastGatewayNoticeAt=gwNotice.at;
      if(gwNotice.kind==='success')gatewaySettingsDraft=null;
    }
    switchDraftThread(state.selectedThreadId||'');
    let forceRender=false;
    const notices=[state.queue&&state.queue.notice,state.steer&&state.steer.notice,state.continuation&&state.continuation.notice].filter(Boolean);
    for(const n of notices){
      const pending=n.requestId&&pendingContinuation[n.requestId];
      if(!pending||pending.threadId!==n.threadId)continue;
      delete pendingContinuation[n.requestId];
      if(n.kind==='success'&&pending.threadId===currentDraftThreadId&&pending.text===String(draft||'').trim()&&JSON.stringify(pending.images)===JSON.stringify(draftImages.map(i=>i.dataUrl))){
        draft='';
        draftImages=[];
        delete drafts[currentDraftThreadId];
        const composerInput=document.getElementById('composerInput');
        if(composerInput){composerInput.value='';composerInput.dispatchEvent(new Event('input',{bubbles:true}))}
        forceRender=true;
      }else if(n.kind==='success'&&pending.threadId!==currentDraftThreadId){
        const saved=drafts[pending.threadId];
        if(saved&&String(saved.text||'').trim()===pending.text&&JSON.stringify((saved.images||[]).map(i=>i.dataUrl))===JSON.stringify(pending.images))delete drafts[pending.threadId];
      }
    }
    if(forceRender||selectionChanged){deferredRender=false;render();}else requestRender();
  }else if(m.type==='codexCurrentChat'){
    state.codexCurrentThreadId=typeof m.threadId==='string'?m.threadId:'';
    renderChats();
  }else if(m.type==='gatewayPayload'){
    const next=m.payload||null;
    if(next&&gatewayPayload&&next.traceId===gatewayPayload.traceId&&next.contentCapture&&gatewayPayload.contentCapture&&Number(next.contentCapture.offset||0)>0){
      next.contentCapture.content=String(gatewayPayload.contentCapture.content||'')+String(next.contentCapture.content||'');
    }
    gatewayPayload=next;
    if(interactionBlocksRender())deferredRender=true;else renderMain();
  }else if(m.type==='chatCopyResult'){
    copyNotice={field:String(m.field||''),kind:m.error?'error':'success',text:m.error?'Copy thất bại: '+String(m.error):'Đã copy.'};
    if(interactionBlocksRender())deferredRender=true;else renderMain();
  }else if(m.type==='error')main.innerHTML='<div class="stopped">'+esc(m.message)+'</div>';
});
render();
</script>
