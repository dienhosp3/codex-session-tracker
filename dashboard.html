function bindComposer(wasFocused,start,end){
  const ta=document.getElementById('composerInput'),steer=document.getElementById('steerBtn'),queue=document.getElementById('queueBtn'),reprobe=document.getElementById('reprobe'),picker=document.getElementById('imagePicker'),addImage=document.getElementById('addImageBtn');
  if(!ta||!steer||!queue)return;
  ta.value=draft;
  const update=()=>{
    draft=ta.value;
    const hasText=Boolean(String(draft).trim()),hasImages=draftImages.length>0,a=state.steer||{},q=state.queue||{};
    steer.disabled=!(hasText||hasImages)||!a.available||Boolean(a.busy||q.busy);
    queue.disabled=!hasText||hasImages||!q.available||Boolean(q.busy||a.busy);
  };
  ta.oninput=update;
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!steer.disabled)steer.click()}};
  steer.onclick=()=>{if(!steer.disabled)vscode.postMessage({command:'steerMessage',text:String(draft||'').trim(),images:draftImages})};
  queue.onclick=()=>{if(!queue.disabled)vscode.postMessage({command:'queueMessage',text:String(draft||'').trim()})};
  if(reprobe)reprobe.onclick=()=>vscode.postMessage({command:'reprobeCodex'});
  if(addImage&&picker)addImage.onclick=()=>picker.click();
  if(picker)picker.onchange=()=>{addDraftImages(picker.files);picker.value=''};
  ta.onpaste=e=>{const files=Array.from(e.clipboardData&&e.clipboardData.files||[]).filter(f=>f.type&&f.type.startsWith('image/'));if(files.length){e.preventDefault();addDraftImages(files)}};
  ta.ondragover=e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files'))e.preventDefault()};
  ta.ondrop=e=>{const files=Array.from(e.dataTransfer&&e.dataTransfer.files||[]).filter(f=>f.type&&f.type.startsWith('image/'));if(files.length){e.preventDefault();addDraftImages(files)}};
  for(const el of document.querySelectorAll('[data-remove-image]'))el.onclick=()=>{draftImages.splice(Number(el.dataset.removeImage),1);renderMain()};
  update();
  if(wasFocused){ta.focus();try{ta.setSelectionRange(Math.min(start,ta.value.length),Math.min(end,ta.value.length))}catch{}}
}
function addDraftImages(files){
  const target=state.selectedThreadId;
  const candidates=Array.from(files||[]);
  if(draftImages.length+candidates.length>5){composerNotice='Tối đa 5 ảnh trong một tin nhắn.';renderMain();return}
  if(candidates.some(file=>!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>8*1024*1024)){
    composerNotice='Chỉ nhận PNG, JPEG, WebP hoặc GIF, tối đa 8 MB mỗi ảnh.';renderMain();return
  }
  Promise.all(candidates.map(file=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name||'Ảnh',mimeType:file.type,dataUrl:String(reader.result||'')});
    reader.onerror=()=>reject(new Error('Không đọc được ảnh.'));
    reader.readAsDataURL(file);
  }))).then(images=>{
    if(target!==state.selectedThreadId)return;
    draftImages.push(...images);
    composerNotice='';
    renderMain();
  }).catch(error=>{composerNotice=String(error.message||error);renderMain()});
}

}
function trafficLabel(e){
  if(e.type==='ws_frame')return 'WS '+(e.direction==='out'?'Codex → server':'server → Codex')+' · opcode '+String(e.opcode??'');
  if(e.type==='http_upstream'){
    if(e.stage==='UPSTREAM_BODY_FINISHED')return 'HTTP request body';
    if(e.stage==='UPSTREAM_FINISHED')return 'HTTP response body';
    return 'HTTP '+(e.stage||'');
  }
  return (e.type||'event')+' '+(e.stage||'');
}
function renderGatewayPayload(){
  const p=gatewayPayload;
  if(!p)return '';
  if(p.missing)return '<div class="payload-view gateway-bad">Không còn payload này trong trace hiện tại.</div>';
  const c=p.contentCapture;
  if(!c)return '<div class="payload-view"><div class="gateway-meta">Event này không có nội dung được capture.</div></div>';
  const meta=[p.kind,p.method,p.path,p.direction,p.requestId&&('request '+p.requestId),p.connectionId&&('conn '+p.connectionId),c.encoding,c.contentType].filter(Boolean).join(' · ');
  return '<div class="payload-view"><div class="card-title">Nội dung input/output đã capture</div><div class="gateway-meta">'+esc(meta)+'</div>'+
    (c.truncated?'<div class="gateway-warn gateway-meta">Đã capture '+esc(String(c.capturedBytes))+'/'+esc(String(c.totalBytes))+' bytes theo giới hạn UI; transport thực tế không bị cắt.</div>':'')+
    '<pre>'+esc(c.content||'')+'</pre></div>';
}
function renderGateway(){
  const g=state.gateway||{},commands=Array.isArray(g.commands)?g.commands:[],cmd=commands[0],settings=gatewaySettingsValue(),managed=g.managedConfig||{},traffic=Array.isArray(g.traffic)?g.traffic:[];
  const status=g.running?'Gateway chạy '+esc((g.address&&g.address.host||'127.0.0.1')+':'+(g.address&&g.address.port||'')):(g.enabled?'Gateway lỗi: '+esc(g.error||'không chạy'):'Gateway tắt');
  const runtime=[g.extensionRuntime&&g.extensionRuntime.version?'Extension '+g.extensionRuntime.version:'',g.cliVersion?'CLI '+g.cliVersion:''].filter(Boolean).join(' · ');
  const proxy=g.modelProxyReady?(g.modelTrafficObserved?'model proxy: ĐÃ THẤY TRAFFIC':'model proxy: SẴN SÀNG, CHƯA THẤY TRAFFIC'):(g.modelProxyConfigured?'model proxy: THIẾU UPSTREAM':'model proxy: TẮT');
  const managedText=managed.active?(managed.managed?'Codex config: đang được Tracker quản lý':managed.drifted?'Codex config: đã thay đổi sau khi bật Gateway':'Codex config: trạng thái không khớp'):'Codex config: chưa route qua Gateway';
  let html='<section class="card"><div class="card-title">Trạng thái giao tiếp</div><div class="gateway-meta">'+status+' · '+proxy+(g.websocketProxyReady?' · WS proxy sẵn sàng':'')+(g.lastModelNetworkAt?' · traffic '+esc(relTime(g.lastModelNetworkAt)):'')+(runtime?' · '+esc(runtime):'')+'</div><div class="gateway-meta" style="margin-top:3px">'+esc(managedText)+(managed.configPath?' · '+esc(managed.configPath):'')+'</div>';

  if(cmd){
    const events=Array.isArray(cmd.events)?cmd.events:[];
    html+='<div class="gateway-grid" style="margin-top:7px">'+events.slice(-10).map(e=>{
      const bad=['NOT_SENT','REJECTED','DELIVERY_UNKNOWN'].includes(e.stage),warn=['POSSIBLE_REPLAY','LOCAL_STALLED','UPSTREAM_STALLED'].includes(e.stage);
      const cls=bad?'gateway-bad':warn?'gateway-warn':'gateway-ok';
      const mark=bad?'×':warn?'!':'✓';
      return '<div class="gateway-row"><span class="gateway-mark '+cls+'">'+mark+'</span><span>'+esc(gatewayStageLabel(e.stage))+(e.confidence&&e.confidence!=='authoritative'?'<div class="gateway-meta">'+esc(e.confidence)+(e.detail?' · '+esc(e.detail):'')+'</div>':(e.detail?'<div class="gateway-meta">'+esc(e.detail)+'</div>':''))+'</span>'+timeHtml(e.at)+'</div>';
    }).join('')+'</div>';
    if(cmd.diagnosis&&cmd.diagnosis.classification)html+='<div class="gateway-meta gateway-warn" style="margin-top:7px">Chẩn đoán: '+esc(cmd.diagnosis.classification)+'</div>';
  }else html+='<div class="sub" style="margin-top:6px">Chưa có lệnh control nào cho chat này.</div>';

  html+='<div class="gateway-settings">'+
    '<label class="gateway-check"><input id="gwEnabled" type="checkbox" '+(settings.enabled?'checked':'')+'> Chạy Gateway local</label>'+
    '<div class="gateway-setting"><label>Port</label><input id="gwPort" type="number" min="1" max="65535" value="'+esc(settings.port||8765)+'"></div>'+
    '<label class="gateway-check"><input id="gwProxy" type="checkbox" '+(settings.modelProxyEnabled?'checked':'')+'> Proxy traffic Codex ↔ backend</label>'+
    '<div class="gateway-setting wide"><label>Upstream gốc</label><input id="gwUpstream" type="text" value="'+esc(settings.upstreamBaseUrl||'https://chatgpt.com/backend-api')+'"></div>'+
    '<label class="gateway-check"><input id="gwCapture" type="checkbox" '+(settings.captureContent?'checked':'')+'> Capture và cho xem nội dung đầy đủ request/response (có thể chứa prompt, file, secret trong body)</label>'+
    '<div class="gateway-setting"><label>Giới hạn nội dung / body hoặc frame (MiB)</label><input id="gwCaptureMax" type="number" min="1" max="64" value="'+esc(settings.captureMaxMb||16)+'"></div>'+
    '<div class="gateway-setting"><label>Trace local trước khi rotate (MiB)</label><input id="gwTraceMax" type="number" min="8" max="512" value="'+esc(settings.traceMaxMb||64)+'"></div>'+
    '<div class="gateway-actions"><button id="gwSave">Lưu cài đặt</button><button id="gwEnableFull" class="primary">Bật bắt toàn bộ + backup config + Reload</button>'+
      (managed.active?'<button id="gwRevert">Revert an toàn + Reload</button><button id="gwForceRestore" class="danger">Khôi phục snapshot gốc + Reload</button>':'')+
    '</div>'+
    (g.actionNotice&&g.actionNotice.text?'<div class="gateway-notice '+(g.actionNotice.kind==='success'?'ok':'err')+'">'+esc(g.actionNotice.text)+'</div>':'')+
    '<div class="gateway-meta wide">Tracker lưu snapshot config.toml gốc trước khi route. Revert an toàn chỉ khôi phục key do Tracker quản lý nếu config đã bị sửa thêm; snapshot gốc chỉ dùng khi mày chủ động chọn.</div>'+
  '</div>';

  html+='<div style="margin-top:9px;padding-top:8px;border-top:1px solid var(--vscode-panel-border)"><div class="card-title">Traffic Codex ↔ backend</div>'+
    '<div class="gateway-meta">Capture nội dung: '+(g.captureContent?'BẬT':'TẮT')+' · '+(g.captureMaxBytes?Math.round(g.captureMaxBytes/1048576)+' MiB/event':'--')+'. Header auth/cookie vẫn bị che; body được giữ nguyên khi capture bật.</div>';
  if(!traffic.length) html+='<div class="sub" style="margin-top:5px">Chưa có traffic đi qua Gateway.</div>';
  else html+='<div class="traffic-list">'+traffic.slice().reverse().slice(0,40).map(e=>{
    const dir=e.type==='ws_frame'?(e.direction==='out'?'out':'in'):(e.stage==='UPSTREAM_BODY_FINISHED'?'out':e.stage==='UPSTREAM_FINISHED'?'in':'');
    const bytes=e.totalContentBytes||e.requestBytes||e.responseBytes||e.size||0;
    const meta=[e.kind,e.method,e.path,bytes?bytes+' B':'',e.statusCode?('HTTP '+e.statusCode):'',e.totalMs?e.totalMs+' ms':''].filter(Boolean).join(' · ');
    return '<div class="traffic-event"><span class="dir '+dir+'">'+(dir==='out'?'↑':dir==='in'?'↓':'•')+'</span><div class="traffic-main"><b>'+esc(trafficLabel(e))+'</b><div class="traffic-small">'+esc(meta)+' · '+esc(absTime(e.at))+(e.truncated?' · truncated capture':'')+'</div></div>'+(e.hasContent?'<button data-gw-trace="'+esc(e.traceId)+'">Xem</button>':'')+'</div>';
  }).join('')+'</div>';
  html+=renderGatewayPayload()+'</div></section>';
  return html;
}
function readGatewaySettingsFromUi(){
  return {
    enabled:Boolean(document.getElementById('gwEnabled')&&document.getElementById('gwEnabled').checked),
    port:Number(document.getElementById('gwPort')&&document.getElementById('gwPort').value||8765),
    modelProxyEnabled:Boolean(document.getElementById('gwProxy')&&document.getElementById('gwProxy').checked),
    upstreamBaseUrl:String(document.getElementById('gwUpstream')&&document.getElementById('gwUpstream').value||'').trim(),
    captureContent:Boolean(document.getElementById('gwCapture')&&document.getElementById('gwCapture').checked),
    captureMaxMb:Number(document.getElementById('gwCaptureMax')&&document.getElementById('gwCaptureMax').value||16),
    traceMaxMb:Number(document.getElementById('gwTraceMax')&&document.getElementById('gwTraceMax').value||64)
  };
}
function bindGatewayUi(){
  const ids=['gwEnabled','gwPort','gwProxy','gwUpstream','gwCapture','gwCaptureMax','gwTraceMax'];
  const updateDraft=()=>{gatewaySettingsDraft=readGatewaySettingsFromUi()};
  for(const id of ids){const el=document.getElementById(id);if(el){el.oninput=updateDraft;el.onchange=updateDraft}}
  const save=document.getElementById('gwSave');if(save)save.onclick=()=>{const value=readGatewaySettingsFromUi();gatewaySettingsDraft=value;vscode.postMessage({command:'saveGatewaySettings',settings:value})};
  const enable=document.getElementById('gwEnableFull');if(enable)enable.onclick=()=>vscode.postMessage({command:'enableGatewayFullCapture'});
  const revert=document.getElementById('gwRevert');if(revert)revert.onclick=()=>vscode.postMessage({command:'revertGatewayManaged'});
  const force=document.getElementById('gwForceRestore');if(force)force.onclick=()=>vscode.postMessage({command:'forceRestoreGatewayManaged'});
  for(const btn of document.querySelectorAll('[data-gw-trace]'))btn.onclick=()=>vscode.postMessage({command:'loadGatewayPayload',traceId:Number(btn.dataset.gwTrace)});
}

function renderComposer(){
  const si=steerInfo(),qi=queueInfo();
  const statuses=[si&&'<div class="action-status '+esc(si.cls)+'" role="status"><b>Steer ngay:</b> '+esc(si.text)+'</div>',qi&&'<div class="action-status '+esc(qi.cls)+'" role="status"><b>Gửi sau:</b> '+esc(qi.text)+'</div>',composerNotice&&'<div class="action-status err" role="alert">'+esc(composerNotice)+'</div>'].filter(Boolean).join('');
  return '<section class="card composer-card"><div class="composer"><textarea id="composerInput" placeholder="Nhập tin nhắn hoặc dán ảnh..." aria-label="Tin nhắn cho chat này"></textarea><div class="composer-actions"><button class="send steer" id="steerBtn" title="Gửi vào lượt đang chạy">Steer ngay</button><button class="send queue" id="queueBtn" title="Xếp tin nhắn gửi sau lượt hiện tại">Gửi sau</button></div></div><div class="composer-image-tools"><button class="iconbtn" type="button" id="addImageBtn" title="Thêm ảnh" aria-label="Thêm ảnh">▧ Ảnh</button><input id="imagePicker" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>'+imageMarkup(draftImages,true)+'</div><div class="composer-meta">'+statuses+'<button class="iconbtn" type="button" id="reprobe" title="Kiểm tra lại khả năng gửi" aria-label="Kiểm tra lại khả năng gửi">↻</button></div></section>';
}
function renderMain(){
  const ui=captureUiState(),old=document.getElementById('composerInput'),wasFocused=old&&document.activeElement===old,start=old&&old.selectionStart||0,end=old&&old.selectionEnd||0,d=state.selected;
  imageSources=[];
  if(!d){main.innerHTML='<div class="empty">Chọn một chat để xem.</div>';return}
  const running=d.stateKind==='running',at=Number(d.lastActivityMs)||0;
  let html='<div class="head"><div class="head-left"><div class="title">'+esc(d.title||'Codex chat')+'</div><div class="sub" title="'+esc(d.cwd||'')+'">'+esc(baseName(d.cwd)||d.cwd||'')+' · hoạt động '+timeHtml(at,'head-time')+'</div></div><div class="state '+(running?'running':'stopped')+'">'+esc(d.state||'Unknown')+'</div></div>';
  html+='<div class="view-switch" role="tablist" aria-label="Cách xem lịch sử"><button type="button" id="summaryView" role="tab" aria-selected="'+String(viewMode==='summary')+'">Tổng quan</button><button type="button" id="chronologicalView" role="tab" aria-selected="'+String(viewMode==='chronological')+'">Theo thứ tự</button></div>';
  html+=renderGateway();
  if(viewMode==='chronological')html+=renderTranscript(d);
  else html+=renderCurrent(d)+renderWorkers(d)+renderHistory(d)+renderLatest(d);
  if(running)html+=renderComposer();
  main.innerHTML=html;
  const setMode=mode=>{viewMode=mode;vscode.setState({...vscode.getState(),viewMode});renderMain()};
  document.getElementById('summaryView').onclick=()=>setMode('summary');
  document.getElementById('chronologicalView').onclick=()=>setMode('chronological');
  bindGatewayUi();
  if(running)bindComposer(wasFocused,start,end);
  bindImageViewer();
  restoreUiState(ui);
}
function render(){renderChats();renderMain()}search.addEventListener('input',renderChats);document.getElementById('refresh').onclick=()=>vscode.postMessage({command:'refresh'});const resizer=document.getElementById('sidebarResizer');
if(resizer){
  let dragging=false,dragVertical=false,startPosition=0,startSize=0;
  const stacked=()=>window.matchMedia('(max-width:700px)').matches;
  const updateResizer=()=>{const vertical=stacked();resizer.setAttribute('aria-orientation',vertical?'horizontal':'vertical');resizer.setAttribute('aria-valuemin',String(vertical?minSidebarHeight:minSidebarWidth));resizer.setAttribute('aria-valuemax',String(vertical?maxSidebarHeight():maxSidebarWidth()));resizer.setAttribute('aria-valuenow',String(vertical?sidebarHeight:sidebarWidth));resizer.setAttribute('aria-label',vertical?'Resize chat list height':'Resize chat list width');resizer.title=resizer.getAttribute('aria-label')};
  const setSize=(size,vertical=stacked())=>{if(vertical){sidebarHeight=clampSidebarHeight(size);document.documentElement.style.setProperty('--sidebar-height',sidebarHeight+'px')}else{sidebarWidth=clampSidebarWidth(size);document.documentElement.style.setProperty('--sidebar-width',sidebarWidth+'px')}updateResizer();vscode.setState({...vscode.getState(),sidebarWidth,sidebarHeight})};
  resizer.addEventListener('pointerdown',e=>{dragging=true;dragVertical=stacked();startPosition=dragVertical?e.clientY:e.clientX;startSize=dragVertical?sidebarHeight:sidebarWidth;resizer.classList.add('dragging');resizer.setPointerCapture?.(e.pointerId);e.preventDefault()});
  resizer.addEventListener('pointermove',e=>{if(dragging)setSize(startSize+(dragVertical?e.clientY:e.clientX)-startPosition,dragVertical)});
  resizer.addEventListener('keydown',e=>{const vertical=stacked(),back=vertical?'ArrowUp':'ArrowLeft',forward=vertical?'ArrowDown':'ArrowRight';if([back,forward,'Home','End'].includes(e.key)){e.preventDefault();const current=vertical?sidebarHeight:sidebarWidth;setSize(e.key==='Home'?(vertical?minSidebarHeight:minSidebarWidth):e.key==='End'?(vertical?maxSidebarHeight():maxSidebarWidth()):current+(e.key===forward?20:-20),vertical)}});
  const stop=()=>{dragging=false;resizer.classList.remove('dragging')};resizer.addEventListener('pointerup',stop);resizer.addEventListener('pointercancel',stop);
  updateResizer();window.addEventListener('resize',()=>setSize(stacked()?sidebarHeight:sidebarWidth));
}
function switchDraftThread(threadId){
  const id=String(threadId||'');
  if(id===currentDraftThreadId)return;
  if(currentDraftThreadId)drafts[currentDraftThreadId]={text:draft,images:draftImages};
  const saved=drafts[id]||{};
  draft=String(saved.text||'');
  draftImages=Array.isArray(saved.images)?saved.images:[];
  currentDraftThreadId=id;
  composerNotice='';
}
function setChatTab(nonRunning){
  state.showNonRunning=nonRunning;
  renderChats();
  vscode.postMessage({command:'setShowNonRunning',enabled:nonRunning});
}
document.getElementById('runningTab').onclick=()=>setChatTab(false);
document.getElementById('nonRunningTab').onclick=()=>setChatTab(true);
window.addEventListener('message',e=>{
  const m=e.data;
  if(m.type==='state'){
    state=m.data||state;
    const gwNotice=state.gateway&&state.gateway.actionNotice;
    if(gwNotice&&gwNotice.at&&gwNotice.at!==lastGatewayNoticeAt){
      lastGatewayNoticeAt=gwNotice.at;
      if(gwNotice.kind==='success')gatewaySettingsDraft=null;
    }
    switchDraftThread(state.selectedThreadId||'');
    const notices=[state.queue&&state.queue.notice,state.steer&&state.steer.notice].filter(Boolean);
    const n=notices.sort((a,b)=>(b.at||0)-(a.at||0))[0];
    if(n&&n.at&&n.at!==lastNoticeAt){
      lastNoticeAt=n.at;
      if(n.kind==='success'){
        draft='';
        draftImages=[];
        delete drafts[currentDraftThreadId];
      }
    }
    render();
  }else if(m.type==='gatewayPayload'){gatewayPayload=m.payload||null;renderMain()}else if(m.type==='error')main.innerHTML='<div class="stopped">'+esc(m.message)+'</div>';
});
render();
</script>
