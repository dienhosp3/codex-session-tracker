function renderTimeline(d){const events=(Array.isArray(d.timeline)?d.timeline:[]).filter(Boolean),groups=groupTimeline(events);if(!groups.length)return '<div class="sub">Ch\u01b0a c\u00f3 s\u1ef1 ki\u1ec7n chi ti\u1ebft.</div>';const html=groups.map((group,index)=>{if(!group.operation)return singleHtml(group.items[0],index);const first=group.items[0],at=Number(first.at)||0,has=group.items.some(x=>String(x.detail||'').trim()),children=group.items.map(childHtml).join('');return '<details class="timeline-item has-detail" data-state-key="timeline:'+esc(first.id||((first.threadId||'')+':'+(first.at||0)))+'"><summary><div class="timeline-row"><span class="timeline-icon '+String(first.kind||'activity')+'"></span><span class="timeline-main"><span class="timeline-label"><b>'+esc(groupLabel(group))+'</b><span class="timeline-actor">'+esc(first.actor||'Main')+'</span><span class="summary-meta"> · '+group.items.length+' m\u1ee5c</span></span><div class="timeline-inline">'+esc(short(group.items.map(x=>x.detail||x.label||'').join(' · '),150))+'</div></span><span class="event-time" title="'+esc(at?absTime(at):'--')+'">'+esc(at?(absTime(at)+' · '+relTime(at)):'--')+'</span></div></summary><div class="timeline-detail"><div class="child-list">'+children+'</div></div></details>'}).join('');return '<div class="timeline">'+html+'</div>'+(d.truncated?'<div class="truncated-note">Nh\u1eadt k\u00fd b\u1ecb gi\u1edbi h\u1ea1n theo dung l\u01b0\u1ee3ng c\u1ea5u h\u00ecnh; c\u00e1c m\u1ee5c c\u0169 h\u01a1n c\u00f3 th\u1ec3 kh\u00f4ng hi\u1ec7n.</div>':'')}
function captureUiState(){const result={open:{},scrollTop:main.scrollTop};main.querySelectorAll('details[data-state-key]').forEach(el=>{result.open[el.dataset.stateKey]=el.open});return result}
function restoreUiState(saved){if(!saved)return;main.querySelectorAll('details[data-state-key]').forEach(el=>{if(Object.prototype.hasOwnProperty.call(saved.open,el.dataset.stateKey))el.open=saved.open[el.dataset.stateKey]});main.scrollTop=Math.min(saved.scrollTop||0,Math.max(0,main.scrollHeight-main.clientHeight))}
function renderMain(){const ui=captureUiState(),old=document.getElementById('composerInput'),wasFocused=old&&document.activeElement===old,start=old&&old.selectionStart||0,end=old&&old.selectionEnd||0,d=state.selected;if(!d){main.innerHTML='<div class="empty">Ch\u1ecdn m\u1ed9t chat \u0111ang ch\u1ea1y.</div>';return}const running=d.stateKind==='running';let html='<div class="head"><div class="head-left"><div class="section-label">Trong cu&#7897;c tr&#242; chuy&#7879;n</div><div class="title">'+esc(d.title||'Codex chat')+'</div><div class="sub" title="'+esc(d.cwd||'')+'">'+esc(baseName(d.cwd)||d.cwd||'')+' \u00b7 ho\u1ea1t \u0111\u1ed9ng '+esc(absTime(d.lastActivityMs))+' \u00b7 '+esc(relTime(d.lastActivityMs))+'</div></div><div class="state '+(running?'running':'stopped')+'">'+esc(d.state||'Unknown')+'</div></div>';if(!running)html+='<div class="stopped-card">Chat \u0111\u00e3 c\u00f3 tr\u1ea1ng th\u00e1i terminal. L\u1ecbch s\u1eed ho\u1ea1t \u0111\u1ed9ng v\u00e0 chi ti\u1ebft v\u1eabn \u0111\u01b0\u1ee3c gi\u1eef l\u1ea1i.</div>';if(d.current){const at=Number(d.current.at)||Number(d.lastActivityMs)||0,detail=String(d.current.detail||'').trim(),detailHtml=detail.length>140?'<details class="current-detail-expand" data-state-key="current"><summary title="'+esc(detail)+'">'+esc(short(detail,140))+'</summary><pre>'+esc(detail)+'</pre></details>':(detail?'<div class="current-detail" title="'+esc(detail)+'">'+esc(detail)+'</div>':'');html+='<section class="card"><div class="card-title">Ho\u1ea1t \u0111\u1ed9ng hi\u1ec7n t\u1ea1i</div><div class="current-card"><div><div class="current-label">'+esc(d.current.label||'\u0110ang x\u1eed l\u00fd')+' <span class="timeline-actor">'+esc(d.current.actor||'Main')+'</span></div>'+detailHtml+'</div><div class="event-time" title="'+esc(at?absTime(at):'--')+'">'+esc(at?(absTime(at)+' \u00b7 '+relTime(at)):'--')+'</div></div></section>'}const workers=(d.activeNodes||[]).slice().sort((a,b)=>(b.currentAt||b.updatedAt||0)-(a.currentAt||a. button></div></section>';main.innerHTML=html;bindComposer(wasFocused,start,end);restoreUiState(ui)}
function render(){renderChats();renderMain()}search.addEventListener('input',renderChats);document.getElementById('refresh').onclick=()=>vscode.postMessage({command:'refresh'});const resizer=document.getElementById('sidebarResizer');if(resizer){let dragging=false,resizerStartX=0,resizerStartWidth=sidebarWidth;const setWidth=width=>{sidebarWidth=clampSidebarWidth(width);document.documentElement.style.setProperty('--sidebar-width',sidebarWidth+'px');resizer.setAttribute('aria-valuemax',String(maxSidebarWidth()));resizer.setAttribute('aria-valuenow',String(sidebarWidth));vscode.setState({...vscode.getState(),sidebarWidth})};resizer.addEventListener('pointerdown',e=>{dragging=true;resizerStartX=e.clientX;resizerStartWidth=sidebarWidth;resizer.classList.add('dragging');resizer.setPointerCapture?.(e.pointerId);e.preventDefault()});resizer.addEventListener('pointermove',e=>{if(dragging)setWidth(resizerStartWidth+e.clientX-resizerStartX)});resizer.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setWidth(e.key==='Home'?minSidebarWidth:e.key==='End'?maxSidebarWidth():sidebarWidth+(e.key==='ArrowRight'?20:-20))}});const stop=()=>{dragging=false;resizer.classList.remove('dragging')};resizer.addEventListener('pointerup',stop);resizer.addEventListener('pointercancel',stop);resizer.setAttribute('aria-valuemax',String(maxSidebarWidth()));resizer.setAttribute('aria-valuenow',String(sidebarWidth));window.addEventListener('resize',()=>setWidth(sidebarWidth))}window.addEventListener('message',e=>{const m=e.data;if(m.type==='state'){state=m.data||state;const notices=[state.queue&&state.queue.notice,state.steer&&state.steer.notice].filter(Boolean),n=notices.sort((a,b)=>(b.at||0)-(a.at||0))[0];if(n&&n.at&&n.at!==lastNoticeAt){lastNoticeAt=n.at;if(n.kind==='success')draft=''}render()}else if(m.type==='error'){main.innerHTML='<div class="stopped">'+esc(m.message)+'</div>'}});render();
