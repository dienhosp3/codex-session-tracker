function addDraftImages(files){

    composerNotice='Chỉ nhận PNG, JPEG, WebP hoặc GIF, tối đa 8 MB mỗi ảnh.';renderMain();return
  }
  Promise.all(candidates.map(file=>new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name||'Ảnh',mimeType:file.type,dataUrl:String(reader.result||'')});

}

function gatewayStageLabel(stage){
  const map={
    LOCAL_CREATED:'Gateway nhận lệnh',
    IPC_SENT:'Đã gửi vào IPC local',
    OWNER_DISCOVERED:'Đã tìm thấy Codex owner',
    OWNER_ROUTED:'Đã route tới Codex owner',
    CORE_ACCEPTED:'Codex local/Core đã nhận',
    LOCAL_PERSISTED:'Đã thấy trong dữ liệu local',
    UPSTREAM_REQUEST_OPENED:'Đã thấy request upstream',
    UPSTREAM_BYTES_SENT:'Đã gửi byte upstream',
    UPSTREAM_RESPONSE_HEADERS:'Server bắt đầu phản hồi',
    UPSTREAM_FIRST_EVENT:'Đã nhận event đầu từ server',
    CODEX_CONSUMED_RESPONSE:'Codex đã consume response',
    TURN_COMPLETED:'Turn đã hoàn tất',
    NOT_SENT:'Chưa gửi',
    REJECTED:'Bị từ chối',
    DELIVERY_UNKNOWN:'Không xác định đã nhận hay chưa',
    LOCAL_STALLED:'Kẹt trước upstream',
    UPSTREAM_STALLED:'Upstream đang kẹt',
    POSSIBLE_REPLAY:'Có dấu hiệu replay'
  };
  return map[stage]||stage||'';
}

function trafficLabel(e){
  if(e.type==='ws_frame')return 'WS '+(e.direction==='out'?'Codex → server':'server → Codex')+' · opcode '+String(e.opcode??'');
  if(e.type==='http_upstream'){
    if(e.stage==='UPSTREAM_REQUEST_CHUNK')return 'HTTP request chunk';
    if(e.stage==='UPSTREAM_BODY_FINISHED')return 'HTTP request body';
    if(e.stage==='UPSTREAM_RESPONSE_CHUNK')return 'HTTP response chunk';
    if(e.stage==='UPSTREAM_FINISHED')return 'HTTP response body';
    return 'HTTP '+(e.stage||'');
  }
  return (e.type||'event')+' '+(e.stage||'');
}
function renderGatewayPayload(){

function proxyRestartTitle(localProxy = {}) {
  const watchdog = localProxy.watchdog || {};
  const assessment = watchdog.assessment || {};
  const last = localProxy.lastRestart;
  const timestamp = value => {
    const at = Number(value);
    return Number.isFinite(at) && at > 0
      ? (Date.now()-at<10*60*60*1000?relTime(at):new Date(at).toLocaleString('vi-VN', { hour12: false }))
      : 'Chưa ghi nhận';
  };
  const lines = [
    localProxy.busy ? 'Đang khởi động lại proxy…' : 'Khởi động lại proxy',
    'Reset thành công gần nhất: ' + timestamp(last?.at || localProxy.lastRestartAt)
  ];
  if (last) {
    lines.push('Nguồn: ' + (last.source === 'auto' ? 'Tự động' : 'Bấm tay') +
      (last.processId ? ' · PID ' + last.processId : '') +
      ' · Đã dừng ' + (last.stoppedCount || 0) + ' tiến trình');
  }
  lines.push('Lần thử gần nhất: ' + timestamp(watchdog.lastAttemptAt));
  lines.push('Tự restart: ' + (watchdog.enabled ? 'Bật' : 'Tắt') + ' · Ngưỡng ' + (watchdog.minutes || 5) + ' phút');
  if (assessment.checkedAt) {
    lines.push('Task đang chạy: ' + (assessment.taskCount || 0));
    if (assessment.latestActivityAt) {
      const seconds = Math.max(0, Math.floor((Date.now() - assessment.latestActivityAt) / 1000));
      lines.push('Task mới nhất hoạt động: ' + timestamp(assessment.latestActivityAt) + ' (' + seconds + ' giây trước)');
    }
    lines.push('Đánh giá gần nhất: ' + timestamp(assessment.checkedAt));
  }
  lines.push('Trạng thái: ' + (watchdog.notice || (watchdog.enabled ? 'Chờ đánh giá task.' : 'Tự restart đang tắt.')));
  if (localProxy.recovery?.pendingCount) lines.push('Khôi phục: đang theo dõi ' + localProxy.recovery.pendingCount + ' chat.');
  if (localProxy.recovery?.notice) lines.push(localProxy.recovery.notice);
  if (localProxy.notice?.text) lines.push(localProxy.notice.text);
  lines.push(localProxy.executablePath ? 'EXE: ' + localProxy.executablePath : 'Chưa chọn file proxy .exe.');
  lines.push('Chuột phải để cài đặt');
  return lines.join('\n');
}

const USAGE_CHART_POINT_OPTIONS=[{value:30,label:'Tối đa 30 mốc'},{value:60,label:'Tối đa 60 mốc'},{value:99,label:'Tối đa 99 mốc'},{value:150,label:'Tối đa 150 mốc'},{value:300,label:'Tối đa 300 mốc'},{value:720,label:'Tất cả mốc'}];
let usageChartPointer=null;

function normalizeUsageChartSettings(value){
  const source=value&&typeof value==='object'?value:{};
  const ranges=USAGE_CHART_RANGES.map(item=>item.value),points=USAGE_CHART_POINT_OPTIONS.map(item=>item.value);
  const rangeMinutes=Number(source.rangeMinutes),maxPoints=Number(source.maxPoints);
  return {rangeMinutes:ranges.includes(rangeMinutes)?rangeMinutes:1440,maxPoints:points.includes(maxPoints)?maxPoints:150};
}
function usageChartLabel(items,value){return (items.find(item=>item.value===value)||items[0]).label}
function usageChartView(chart,settings){
  const all=Array.isArray(chart&&chart.points)?chart.points.filter(point=>Number.isFinite(Number(point.at))&&Number.isFinite(Number(point.usedPercent))).sort((a,b)=>a.at-b.at):[];
  if(!all.length)return {points:[],sourceCount:0,rangeStart:0,rangeEnd:0};
  const end=Number(chart.rangeEnd)||all.at(-1).at;
  const rangeMs=settings.rangeMinutes>0?settings.rangeMinutes*60000:Math.max(0,(Number(chart.rangeEnd)||end)-(Number(chart.rangeStart)||all[0].at));
  const rangeStart=settings.rangeMinutes>0?end-rangeMs:(Number(chart.rangeStart)||all[0].at);
  const filtered=all.filter(point=>point.at>=rangeStart&&point.at<=end);
  const limit=settings.maxPoints;
  if(!limit||filtered.length<=limit)return {points:filtered,sourceCount:filtered.length,rangeStart,rangeEnd:end};
  const picked=[];
  const step=(filtered.length-1)/(limit-1);
  for(let index=0;index<limit;index++)picked.push(filtered[Math.round(index*step)]);
  return {points:picked,sourceCount:filtered.length,rangeStart,rangeEnd:end};
}
function usageChartPlot(chart,settings){

  const polyline=points.map(point=>x(point.at).toFixed(2)+','+y(point.usedPercent).toFixed(2)).join(' ');
  const markers=points.map(point=>'<circle class="usage-chart-point" data-at="'+Number(point.at)+'" data-used="'+Number(point.usedPercent)+'" cx="'+x(point.at).toFixed(2)+'" cy="'+y(point.usedPercent).toFixed(2)+'" r="3"></circle>').join('');

  const hover='<g class="usage-chart-hover" visibility="hidden" aria-hidden="true"><line class="usage-chart-guide" y1="'+top+'" y2="'+(height-bottom)+'"></line><circle class="usage-chart-highlight" r="6"></circle></g>';

function bindUsageChartHover(container){
  const frame=container?.querySelector('.usage-chart-frame'),svg=frame?.querySelector('svg');
  if(!svg)return;
  const tooltip=frame.querySelector('.usage-chart-tooltip'),hover=svg.querySelector('.usage-chart-hover');
  const guide=hover.querySelector('line'),highlight=hover.querySelector('circle');
  const points=Array.from(svg.querySelectorAll('.usage-chart-point'),node=>({
    x:Number(node.getAttribute('cx')),y:Number(node.getAttribute('cy')),at:Number(node.dataset.at),used:Number(node.dataset.used)
  }));
  const clear=()=>{hover.setAttribute('visibility','hidden');tooltip.hidden=true;usageChartPointer=null;};
  const show=event=>{
    const matrix=svg.getScreenCTM();
    if(!matrix)return clear();
    const pointer=svg.createSVGPoint();pointer.x=event.clientX;pointer.y=event.clientY;
    const local=pointer.matrixTransform(matrix.inverse());
    // Include the marker radius so edge samples remain reachable after SVG scaling.
    if(local.x<Number(svg.dataset.left)-6||local.x>Number(svg.dataset.right)+6||local.y<Number(svg.dataset.top)-6||local.y>Number(svg.dataset.bottom)+6)return clear();
    const point=points.reduce((best,item)=>{
      const dx=Math.abs(item.x-local.x),bestDx=Math.abs(best.x-local.x);
      return dx<bestDx||(dx===bestDx&&Math.abs(item.y-local.y)<Math.abs(best.y-local.y))?item:best;
    });
    usageChartPointer={clientX:event.clientX,clientY:event.clientY,owner:container.id};
    guide.setAttribute('x1',point.x);guide.setAttribute('x2',point.x);
    highlight.setAttribute('cx',point.x);highlight.setAttribute('cy',point.y);
    hover.setAttribute('visibility','visible');
    const time=tooltip.querySelector('time');
    time.textContent=absTime(point.at);time.dateTime=new Date(point.at).toISOString();
    tooltip.querySelector('strong').textContent='Đã dùng '+point.used.toLocaleString('vi-VN',{maximumFractionDigits:2})+'%';
    tooltip.hidden=false;
    pointer.x=point.x;pointer.y=point.y;
    const anchor=pointer.matrixTransform(matrix),bounds=frame.getBoundingClientRect();
    const px=anchor.x-bounds.left,py=anchor.y-bounds.top,tw=tooltip.offsetWidth,th=tooltip.offsetHeight;
    const left=px+tw+12>frame.clientWidth-8?px-tw-12:px+12,top=py-th-12<8?py+12:py-th-12;
    tooltip.style.left=Math.max(8,Math.min(frame.clientWidth-tw-8,left))+'px';
    tooltip.style.top=Math.max(8,Math.min(frame.clientHeight-th-8,top))+'px';
  };
  svg.onpointerenter=svg.onpointermove=show;
  svg.onpointerleave=svg.onpointercancel=clear;
  // Polling replaces the SVG; restore hover after scroll and layout are restored.
  if(usageChartPointer?.owner===container.id)requestAnimationFrame(()=>{
    if(!svg.isConnected||usageChartPointer?.owner!==container.id)return;
    if(svg.contains(document.elementFromPoint(usageChartPointer.clientX,usageChartPointer.clientY)))show(usageChartPointer);
    else clear();
  });
}

function parseUsageAlertDialogList(id,kind,allowEmpty){
  const value=String(document.getElementById(id)?.value||'').trim();
  if(!value)return allowEmpty?[]:null;
  const values=value.split(',').map(item=>Number(item.trim()));
  const valid=values.length>0&&values.every(item=>Number.isFinite(item)&&(kind==='percent'?(item>0&&item<100):(item>0&&item<=1000)));
  return valid?values:null;
}

function parseUsageVoiceLargeChange(){

  const percent=Number(value);

function parseContextCompactThreshold(){

const pendingContinuation={};

let deferredRender=false;
function interactionBlocksRender(){
  const active=document.activeElement;
  if(contextWatchPointerActive)return true;
  if(main.contains(active)&&active.matches('textarea,input,select,[contenteditable="true"]')&&!active.matches('[data-failure-auto]'))return true;
  const selection=window.getSelection&&window.getSelection();
  return Boolean(selection&&!selection.isCollapsed&&main.contains(selection.anchorNode));
}
function requestRender(){
  if(interactionBlocksRender()){deferredRender=true;renderChats();return;}
  deferredRender=false;
  render();
}
function flushDeferredRender(){
  if(deferredRender&&!interactionBlocksRender()){deferredRender=false;render();}
}

window.addEventListener('message',e=>{
  const m=e.data;
  if(m.type==='state'){
    const previousThreadId=state.selectedThreadId;
    state=m.data||state;
    window.TrackerAccountsUI?.sync(state);
    const selectionChanged=previousThreadId!==state.selectedThreadId;
    const gwNotice=state.gateway&&state.gateway.actionNotice;
    if(gwNotice&&gwNotice.at&&gwNotice.at!==lastGatewayNoticeAt){
      lastGatewayNoticeAt=gwNotice.at;
      if(gwNotice.kind==='success')gatewaySettingsDraft=null;
    }
    switchDraftThread(state.selectedThreadId||'');
    let forceRender=false;
    const notices=[state.queue&&state.queue.notice,state.steer&&state.steer.notice,state.continuation&&state.continuation.notice].filter(Boolean);
    for(const n of notices){
      const pending=n.requestId&&pendingContinuation[n.requestId];
      if(!pending||pending.threadId!==n.threadId)continue;
      delete pendingContinuation[n.requestId];
      if(n.kind==='success'&&pending.threadId===currentDraftThreadId&&pending.text===String(draft||'').trim()&&JSON.stringify(pending.images)===JSON.stringify(draftImages.map(i=>i.dataUrl))){
        draft='';
        draftImages=[];
        delete drafts[currentDraftThreadId];
        const composerInput=document.getElementById('composerInput');
        if(composerInput){composerInput.value='';composerInput.dispatchEvent(new Event('input',{bubbles:true}))}
        forceRender=true;
      }else if(n.kind==='success'&&pending.threadId!==currentDraftThreadId){
        const saved=drafts[pending.threadId];
        if(saved&&String(saved.text||'').trim()===pending.text&&JSON.stringify((saved.images||[]).map(i=>i.dataUrl))===JSON.stringify(pending.images))delete drafts[pending.threadId];
      }
    }
    if(forceRender||selectionChanged){deferredRender=false;render();}else requestRender();
  }else if(m.type==='contextWatchSaved'){
    if(m.data)state.contextWatch=m.data;
    requestRender();
  }else if(m.type==='contextWatch'){
    const previous=state.contextWatch||{},next=m.data||{};
    state.contextWatch=next;
    const changed=JSON.stringify([previous.intervalMs,previous.thresholdPercent,previous.entries,previous.busy])!==JSON.stringify([next.intervalMs,next.thresholdPercent,next.entries,next.busy]);
    if(changed)requestRender();else updateContextReadings();
  }else if(m.type==='codexCurrentChat'){
    state.codexCurrentThreadId=typeof m.threadId==='string'?m.threadId:'';
    renderChats();
  }else if(m.type==='gatewayPayload'){
    const next=m.payload||null;
    if(next&&gatewayPayload&&next.traceId===gatewayPayload.traceId&&next.contentCapture&&gatewayPayload.contentCapture&&Number(next.contentCapture.offset||0)>0){
      next.contentCapture.content=String(gatewayPayload.contentCapture.content||'')+String(next.contentCapture.content||'');
    }
    gatewayPayload=next;
    if(interactionBlocksRender())deferredRender=true;else renderMain();
  }else if(m.type==='chatCopyResult'){
    copyNotice={field:String(m.field||''),kind:m.error?'error':'success',text:m.error?'Copy thất bại: '+String(m.error):'Đã copy.'};
    if(interactionBlocksRender())deferredRender=true;else renderMain();
  }else if(m.type==='error')main.innerHTML='<div class="stopped">'+esc(m.message)+'</div>';
});
