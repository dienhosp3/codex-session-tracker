<style>
.proxy-options-dialog{width:min(500px,calc(100vw - 24px))}.proxy-options-check{display:flex;gap:7px;align-items:center}.proxy-options-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.proxy-options-row input{width:80px;min-width:0;padding:7px;background:var(--vscode-input-background,#333);color:inherit;border:1px solid var(--vscode-panel-border,#555);border-radius:5px;font:inherit}.proxy-options-path{display:flex;gap:7px;align-items:center}.proxy-options-path span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px}#poStatus:empty{display:none}
</style>
<dialog id="proxyOptionsDialog" class="nc-dialog proxy-options-dialog" aria-labelledby="poTitle">
  <form id="poForm">
    <header class="nc-header"><div class="nc-heading"><h2 id="poTitle">Khởi động lại proxy</h2></div><button id="poClose" class="iconbtn nc-close" type="button" aria-label="Đóng cài đặt proxy">×</button></header>
    <div class="nc-body">
      <label class="proxy-options-check"><input id="poEnabled" type="checkbox">Tự khởi động lại</label>
      <label class="proxy-options-row">Im lặng (phút)<input id="poMinutes" type="number" min="1" max="1440" step="1" required value="5"></label>
      <div class="nc-field"><span class="nc-label">Proxy EXE</span><div class="proxy-options-path"><span id="poPath"></span><button id="poBrowse" class="nc-button" type="button">Chọn…</button></div></div>
      <div id="poStatus" class="nc-status" role="status" aria-live="polite"></div>
    </div>
    <footer class="nc-footer"><button id="poCancel" class="nc-button" type="button">Đóng</button><button id="poSave" class="nc-button primary" type="submit" aria-label="Lưu cài đặt proxy" title="Lưu cài đặt proxy"><svg class="save-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 1.5h9l3 3v10H2zM5 1.5v4h6v-4M5 14.5v-6h6v6"/></svg></button></footer>
  </form>
</dialog>
