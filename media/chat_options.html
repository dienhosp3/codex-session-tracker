<style>
.chat-options-dialog{width:min(410px,calc(100vw - 24px))}.chat-option-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.chat-option-row input[type=number]{box-sizing:border-box;width:90px;flex:none;padding:7px;border:1px solid var(--vscode-input-border,#555);border-radius:5px;background:var(--vscode-input-background,#303030);color:inherit;font:inherit}.chat-option-completion{display:flex;align-items:center;gap:7px}.chat-option-completion input{accent-color:#20caff}#coStatus:empty{display:none}.chat-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}.chat-actions .action-status{flex-basis:100%;overflow-wrap:anywhere}.chat-options-button{flex:none;padding:3px 5px;line-height:1}
</style>
<style>
.co-identity{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:10px}.co-field{display:grid;gap:5px;min-width:0}.co-field input{box-sizing:border-box;width:100%;min-width:0;padding:7px;border:1px solid var(--vscode-input-border,#555);border-radius:5px;background:var(--vscode-input-background,#303030);color:inherit;font:inherit}#coNextPreview{margin-top:-8px;font-size:11px;color:var(--vscode-descriptionForeground,#aaa);overflow-wrap:anywhere}#coNextPreview:empty{display:none}
</style>
<dialog id="chatOptionsDialog" class="nc-dialog chat-options-dialog" aria-labelledby="coTitle">
  <form id="coForm">
    <header class="nc-header"><div class="nc-heading"><h2 id="coTitle">Tuỳ chọn chat</h2><div id="coSource" class="hf-source"></div></div><button id="coClose" class="iconbtn nc-close" type="button" aria-label="Đóng tuỳ chọn chat">×</button></header>
    <div class="nc-body">
      <label class="co-field" for="coLabel">Nhãn hiển thị<input id="coLabel" type="text" placeholder="Dùng tên gốc" title="Chỉ hiển thị trong Tracker, không đổi tên gốc"></label>
      <div class="co-identity"><label class="co-field" for="coCode">ID chat hiện tại<input id="coCode" type="text" placeholder="Chưa đặt" title="1–30 chữ hoặc số"></label><label class="co-field" for="coNumber">Số hiện tại<input id="coNumber" type="text" inputmode="numeric" pattern="[0-9]+" value="0001"></label></div>
      <div id="coNextPreview" aria-live="polite"></div>
      <label class="chat-option-row" for="coDelay">Chờ mở chat mới (giây)<input id="coDelay" type="number" min="0" max="3600" step="1" required></label>
      <label class="chat-option-row" for="coInterval">Chu kỳ kiểm tra (ms)<input id="coInterval" type="number" min="100" max="60000" step="1" required></label>
      <label class="chat-option-row" for="coThreshold">Ngưỡng chat hiện tại (%)<input id="coThreshold" type="number" min="1" max="99" step="1" required style="width:52px"></label>
      <label class="chat-option-completion" title="Áp dụng cùng công tắc âm thanh chung"><input id="coCompletion" type="checkbox">Âm báo hoàn tất</label>
      <label class="chat-option-completion" title="Toàn quyền: tự cho phép lệnh và sửa file trong chat này. Tắt: ngừng tự duyệt ngay; quyền trước đó áp dụng từ lượt kế tiếp."><input id="coAutoAllow" type="checkbox">Auto Allow</label>
      <div id="coStatus" class="nc-status" role="status" aria-live="polite"></div>
    </div>
    <footer class="nc-footer"><button id="coCancel" class="nc-button" type="button">Đóng</button><button id="coSave" class="nc-button primary" type="submit" title="Lưu tuỳ chọn chat" aria-label="Lưu tuỳ chọn chat"><svg class="save-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 1.5h9l3 3v10H2zM5 1.5v4h6v-4M5 14.5v-6h6v6"/></svg></button></footer>
  </form>
</dialog>
